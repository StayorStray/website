<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 310" fill="none" role="img" aria-labelledby="sosTitle">
  <title id="sosTitle">Stay or Stray</title>
  <!-- Stay or Stray locked brand lockup — white on transparent (dark-header ready) -->

  <!-- Curved contrail (fades toward left) -->
  <defs>
    <linearGradient id="trailFade" x1="100%" y1="0%" x2="0%" y2="20%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <path d="M420 128 C340 145, 250 165, 120 195"
        stroke="url(#trailFade)" stroke-width="3.6" fill="none"
        stroke-linecap="round"/>

  <!-- Climbing commercial jet -->
  <g fill="#ffffff" transform="translate(545 100) rotate(-34) scale(1.15)">
    <!-- fuselage -->
    <path d="M-70 0
      C-70 -6.5 -62 -10 -52 -10
      L28 -10
      C42 -10 54 -6 64 -1.5
      L72 0
      L64 1.5
      C54 6 42 10 28 10
      L-52 10
      C-62 10 -70 6.5 -70 0Z"/>
    <!-- wings -->
    <path d="M-22 2 L12 2 L-2 36 L-16 36 L-30 8Z"/>
    <path d="M-22 -2 L12 -2 L-2 -36 L-16 -36 L-30 -8Z"/>
    <!-- horizontal stabilizer -->
    <path d="M-58 1 L-42 1 L-48 15 L-58 15Z"/>
    <path d="M-58 -1 L-42 -1 L-48 -15 L-58 -15Z"/>
    <!-- vertical fin -->
    <path d="M-68 -1 L-50 -1 L-58 -26 L-72 -20Z"/>
    <!-- engines -->
    <ellipse cx="-2" cy="16" rx="6.5" ry="3.8"/>
    <ellipse cx="-2" cy="-16" rx="6.5" ry="3.8"/>
  </g>

  <!-- Wordmark: STΛY OR STRΛY using Greek Lambda for open A -->
  <text x="500" y="272" text-anchor="middle"
        fill="#ffffff"
        font-family="Montserrat, Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="56"
        font-weight="700"
        letter-spacing="0.16em">ST&#923;Y OR STR&#923;Y</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 310" fill="none" role="img" aria-labelledby="gonTitle">
  <title id="gonTitle">Go or No</title>
  <!-- Go or No brand lockup — white on transparent (dark-header ready).
       Same jet + contrail as the original lockup; the two O's carry the
       site's Go (green) and No (coral) button colors. -->
  <defs>
    <linearGradient id="trailFade" x1="100%" y1="0%" x2="0%" y2="20%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <path d="M446 131 C350 150, 250 168, 120 195" stroke="url(#trailFade)" stroke-width="3.6" fill="none" stroke-linecap="round"/>
  <g fill="#ffffff" transform="translate(540 104) rotate(-28) scale(1.2)">
    <path d="M-62 0 C-62 -4 -58 -6 -52 -6 L50 -6 C60 -6 68 -3 72 0 C68 3 60 6 50 6 L-52 6 C-58 6 -62 4 -62 0Z"/>
    <path d="M14 -5 L-20 -52 L-31 -52 L-14 -5Z"/>
    <path d="M14 5 L-20 52 L-31 52 L-14 5Z"/>
    <path d="M-40 -4 L-56 -22 L-63 -22 L-54 -4Z"/>
    <path d="M-40 4 L-56 22 L-63 22 L-54 4Z"/>
    <rect x="-8" y="-27" width="16" height="7" rx="3.5"/>
    <rect x="-8" y="20" width="16" height="7" rx="3.5"/>
  </g>
  <!-- Wordmark: GO OR NO -->
  <text x="508" y="282" text-anchor="middle" fill="#ffffff"
        font-family="Montserrat, Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="86" font-weight="700" letter-spacing="0.14em">G<tspan fill="#2f9e6b">O</tspan> OR N<tspan fill="#c45c4a">O</tspan></text>
</svg>
